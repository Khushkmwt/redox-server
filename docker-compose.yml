services:
  redox:
    build:
      context: .
      target: production
    container_name: redox-server
    ports:
      # Bind to localhost by default for security (R18)
      - "127.0.0.1:${PORT:-6379}:6379"
    env_file:
      - .env
    environment:
      HOST: "0.0.0.0"
      PORT: "${PORT:-6379}"
      MAX_MEMORY: "${MAX_MEMORY:-}"
      EVICTION_POLICY: "${EVICTION_POLICY:-noeviction}"
      REDOX_PASSWORD: "${REDOX_PASSWORD:-}"
      TIMEOUT: "${TIMEOUT:-0}"
      DUMP_PATH: "/app/data/dump.json"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e",
        "const net = require('net');
         const s = net.createConnection(6379, '127.0.0.1', () => { s.write('*1\\r\\n$4\\r\\nPING\\r\\n'); });
         s.on('data', () => { s.destroy(); process.exit(0); });
         s.on('error', () => process.exit(1));
         setTimeout(() => process.exit(1), 3000);"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    volumes:
      - redox-data:/app/data

volumes:
  redox-data:
